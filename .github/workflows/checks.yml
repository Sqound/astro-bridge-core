name: Core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: python tools/build-plugins.py --check && python tools/build-i18n.py --check
      - run: python scripts/generate_openapi.py && git diff --exit-code -- wifi_bridge/static/openapi.json
      - run: python tools/build-release.py
      - run: python tools/verify-installed.py --wheel dist/astro_bridge_core-1.0.1-py3-none-any.whl
